name: Recover and merge Final Draft obligation flow

on:
  push:
    branches: [feature/final-draft-obligation-flow]
    paths: [.github/workflows/recover-final-draft-flow.yml]

permissions:
  contents: write
  pull-requests: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/final-draft-obligation-flow

      - name: Apply idempotent integration fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          required = [
            'StoryMentor/Models/GuidedScreenplayObligations.swift',
            'StoryMentor/Services/GuidedScreenplayObligationEngine.swift',
            'StoryMentor/AI/GuidedFinalDraftCompilerEngine.swift',
            'StoryMentor/Services/GuidedFinalDraftProjectWriter.swift',
            'StoryMentor/Views/GuidedFlow/GuidedStructureSelectionView.swift',
            'StoryMentor/Views/GuidedFlow/GuidedFinalDraftWorkspaceView.swift',
          ]
          for name in required:
            if not Path(name).exists():
              raise SystemExit(f'missing required source: {name}')

          models = Path('StoryMentor/Models/GuidedScreenplayObligations.swift')
          text = models.read_text()
          text = text.replace(
            'nonisolated enum GuidedScreenplayEchoKind: String, Codable, Hashable, Sendable {',
            'nonisolated enum GuidedScreenplayEchoKind: String, CaseIterable, Codable, Hashable, Sendable {'
          )
          models.write_text(text)

          writer = Path('StoryMentor/Services/GuidedFinalDraftProjectWriter.swift')
          text = writer.read_text()
          text = text.replace(
'''    guard let updatedScreenplay = FountainParser.replacingScene(
      at: sceneIndex,
      in: project.screenplayText,
      with: result.fountainText
    ) else {
      throw GuidedFinalDraftProjectWriterError.sceneReplacementFailed
    }''',
'''    let updatedScreenplay = FountainParser.replacingScene(
      at: sceneIndex,
      in: project.screenplayText,
      with: result.fountainText
    )'''
          )
          writer.write_text(text)

          workspace = Path('StoryMentor/Views/Workspace/WorkspaceContentView.swift')
          text = workspace.read_text().replace(
            'GuidedFlowWorkspaceView(',
            'GuidedFinalDraftWorkspaceView('
          )
          workspace.write_text(text)

          studio = Path('StoryMentor/Views/Screenplay/ScreenplayStudioView.swift')
          text = studio.read_text()
          if 'var guidedMode = false' not in text:
            text = text.replace(
'''    @Bindable var project: StoryProject
    let onNavigate: (WorkspaceSection) -> Void
    @Query private var workspaceStates: [ScreenplayWorkspaceState]''',
'''    @Bindable var project: StoryProject
    let onNavigate: (WorkspaceSection) -> Void
    var guidedMode = false
    @Query private var workspaceStates: [ScreenplayWorkspaceState]''', 1)
          if '''            if !guidedMode {
                aiCreationHeader
            }''' not in text:
            text = text.replace(
'''        VStack(spacing: 10) {
            aiCreationHeader
            editorBody
            statusBar
        }''',
'''        VStack(spacing: 10) {
            if !guidedMode {
                aiCreationHeader
            }
            editorBody
            statusBar
        }''', 1)
          if 'showingNavigator = false' not in text:
            text = text.replace(
'''        .task {
            let addedNSIRMappings = SceneMappingEngine.synchronizeNSIRTransitions(''',
'''        .task {
            if guidedMode {
                showingNavigator = false
                showingDramaticLens = false
                canvasMode = .scene
            }
            let addedNSIRMappings = SceneMappingEngine.synchronizeNSIRTransitions(''', 1)
          if 'requestedContractID = project.requestedSceneContractID' not in text:
            text = text.replace(
'''            lastCommittedFullText = project.screenplayText
            if let incomplete = firstIncompleteSmallBeatContract,''',
'''            lastCommittedFullText = project.screenplayText
            if let requestedContractID = project.requestedSceneContractID,
               let record = synchronizedSceneRecords.first(where: {
                   $0.sceneContractID == requestedContractID
               }) {
                project.requestedSceneContractID = nil
                loadScene(at: record.order)
            } else if let incomplete = firstIncompleteSmallBeatContract,''', 1)
          if '.guidedFlowCommitScreenplay' not in text:
            text = text.replace(
'''        .onDisappear {
            sceneDraftSaveTask?.cancel()
            commitSceneDraft()
        }''',
'''        .onChange(of: project.requestedSceneContractID) { _, requestedID in
            guard let requestedID else { return }
            focusRequestedSceneContract(requestedID)
        }
        .onReceive(
            NotificationCenter.default.publisher(for: .guidedFlowCommitScreenplay)
        ) { notification in
            guard let projectID = notification.object as? UUID,
                  projectID == project.id else { return }
            commitSceneDraft()
        }
        .onDisappear {
            sceneDraftSaveTask?.cancel()
            commitSceneDraft()
        }''', 1)
          if 'private func focusRequestedSceneContract' not in text:
            text = text.replace(
'''    private func selectSceneContract(_ contract: SceneContract) {''',
'''    private func focusRequestedSceneContract(_ contractID: UUID) {
        guard let record = synchronizedSceneRecords.first(where: {
            $0.sceneContractID == contractID
        }) else { return }
        project.requestedSceneContractID = nil
        selectScene(record.order)
    }

    private func selectSceneContract(_ contract: SceneContract) {''', 1)
          studio.write_text(text)
          PY

          for file in \
            StoryMentor/Models/GuidedScreenplayObligations.swift \
            StoryMentor/Services/GuidedScreenplayObligationEngine.swift \
            StoryMentor/AI/GuidedFinalDraftCompilerEngine.swift \
            StoryMentor/Services/GuidedFinalDraftProjectWriter.swift \
            StoryMentor/Views/GuidedFlow/GuidedStructureSelectionView.swift \
            StoryMentor/Views/GuidedFlow/GuidedFinalDraftWorkspaceView.swift \
            StoryMentor/Views/Screenplay/ScreenplayStudioView.swift \
            StoryMentor/Views/Workspace/WorkspaceContentView.swift; do
            swiftc -frontend -parse "$file"
          done

          grep -q 'GuidedFinalDraftWorkspaceView' StoryMentor/Views/Workspace/WorkspaceContentView.swift
          grep -q 'var guidedMode = false' StoryMentor/Views/Screenplay/ScreenplayStudioView.swift
          grep -q 'guidedFlowCommitScreenplay' StoryMentor/Views/Screenplay/ScreenplayStudioView.swift
          grep -q 'ScreenplayReviewEngine.isReady' StoryMentor/Services/GuidedScreenplayObligationEngine.swift
          grep -q 'TheoryIndexStore.shared.search' StoryMentor/AI/GuidedFinalDraftCompilerEngine.swift
          grep -q 'StoryDNAService.shared.matches' StoryMentor/AI/GuidedFinalDraftCompilerEngine.swift

      - name: Commit final clean branch
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-final-draft-obligation.yml \
            .github/workflows/finalize-final-draft-obligation.yml \
            .github/workflows/recover-final-draft-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: finish screenplay through hidden Final Draft obligations"
            git push origin HEAD:feature/final-draft-obligation-flow
          fi

      - name: Merge PR 3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sleep 4
          gh pr merge 3 --repo huojigaowan-sketch/draft --squash --delete-branch
