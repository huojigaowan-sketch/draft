name: Finalize guided Final Draft integration

'on':
  push:
    branches:
      - feature/final-draft-obligation-flow
    paths:
      - .github/workflows/finalize-guided-final-draft-v4.yml
      - .github/scripts/finalize_guided_final_draft.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/final-draft-obligation-flow
          fetch-depth: 0

      - name: Apply production integration and documentation
        run: python3 .github/scripts/finalize_guided_final_draft.py

      - name: Parse changed Swift sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            StoryMentor/Models/GuidedScreenplayObligations.swift
            StoryMentor/Services/GuidedScreenplayObligationEngine.swift
            StoryMentor/AI/GuidedFinalDraftCompilerEngine.swift
            StoryMentor/Services/GuidedFinalDraftProjectWriter.swift
            StoryMentor/Views/GuidedFlow/GuidedStructureSelectionView.swift
            StoryMentor/Views/GuidedFlow/GuidedFinalDraftWorkspaceView.swift
            StoryMentor/Views/Screenplay/ScreenplayStudioView.swift
            StoryMentor/Views/Workspace/WorkspaceContentView.swift
          )
          for file in "${files[@]}"; do
            swiftc -frontend -parse "$file"
          done
          if command -v swift-format >/dev/null 2>&1; then
            swift-format lint --strict "${files[@]}"
          fi

      - name: Assert the product path is connected
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GuidedFinalDraftWorkspaceView(project: project' StoryMentor/Views/Workspace/WorkspaceContentView.swift
          grep -q 'var guidedMode = false' StoryMentor/Views/Screenplay/ScreenplayStudioView.swift
          grep -q 'guidedFlowCommitScreenplay' StoryMentor/Views/Screenplay/ScreenplayStudioView.swift
          grep -q 'requestedSceneContractID' StoryMentor/Views/Screenplay/ScreenplayStudioView.swift
          grep -q 'CaseIterable, Codable' StoryMentor/Models/GuidedScreenplayObligations.swift
          grep -q 'TheoryIndexStore.shared.search' StoryMentor/AI/GuidedFinalDraftCompilerEngine.swift
          grep -q 'StoryDNAService.shared.matches' StoryMentor/AI/GuidedFinalDraftCompilerEngine.swift
          test -f Documentation/GuidedFinalDraftWorkflow.md
          test ! -f .github/workflows/apply-final-draft-obligation.yml
          test ! -f .github/workflows/finalize-final-draft-obligation.yml
          test ! -f .github/workflows/recover-final-draft-flow.yml

      - name: Commit the clean production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: finish screenplay through hidden Final Draft obligations'
          git push origin HEAD:feature/final-draft-obligation-flow
