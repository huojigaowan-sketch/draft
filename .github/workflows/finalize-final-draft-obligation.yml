name: Verify and merge Final Draft obligation flow

on:
  push:
    branches:
      - feature/final-draft-obligation-flow
    paths:
      - .github/workflows/finalize-final-draft-obligation.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/final-draft-obligation-flow

      - name: Verify obligation integration
        shell: bash
        run: |
          test -f StoryMentor/Models/GuidedScreenplayObligations.swift
          test -f StoryMentor/Services/GuidedScreenplayObligationEngine.swift
          test -f StoryMentor/AI/GuidedFinalDraftCompilerEngine.swift
          test -f StoryMentor/Services/GuidedFinalDraftProjectWriter.swift
          test -f StoryMentor/Views/GuidedFlow/GuidedStructureSelectionView.swift
          test -f StoryMentor/Views/GuidedFlow/GuidedFinalDraftWorkspaceView.swift
          test ! -f .github/workflows/apply-final-draft-obligation.yml

          grep -q 'GuidedFinalDraftWorkspaceView' StoryMentor/Views/Workspace/WorkspaceContentView.swift
          grep -q 'var guidedMode = false' StoryMentor/Views/Screenplay/ScreenplayStudioView.swift
          grep -q 'guidedFlowCommitScreenplay' StoryMentor/Views/Screenplay/ScreenplayStudioView.swift
          grep -q 'focusRequestedSceneContract' StoryMentor/Views/Screenplay/ScreenplayStudioView.swift
          grep -q 'ScreenplayReviewEngine.isReady' StoryMentor/Services/GuidedScreenplayObligationEngine.swift
          grep -q 'TheoryIndexStore.shared.search' StoryMentor/AI/GuidedFinalDraftCompilerEngine.swift
          grep -q 'StoryDNAService.shared.matches' StoryMentor/AI/GuidedFinalDraftCompilerEngine.swift
          grep -q 'FountainTextEditor' StoryMentor/Views/Screenplay/ScreenplayStudioView.swift

          for file in \
            StoryMentor/Models/GuidedScreenplayObligations.swift \
            StoryMentor/Services/GuidedScreenplayObligationEngine.swift \
            StoryMentor/AI/GuidedFinalDraftCompilerEngine.swift \
            StoryMentor/Services/GuidedFinalDraftProjectWriter.swift \
            StoryMentor/Views/GuidedFlow/GuidedStructureSelectionView.swift \
            StoryMentor/Views/GuidedFlow/GuidedFinalDraftWorkspaceView.swift \
            StoryMentor/Views/Screenplay/ScreenplayStudioView.swift \
            StoryMentor/Views/Workspace/WorkspaceContentView.swift; do
            swiftc -frontend -parse "$file"
          done

          changed=$(git diff --name-only origin/main...HEAD)
          if echo "$changed" | grep -q '^\.github/workflows/apply-final-draft-obligation.yml$'; then
            echo 'Temporary apply workflow remains in final diff.' >&2
            exit 1
          fi

      - name: Remove verification workflow from final branch
        shell: bash
        run: |
          rm .github/workflows/finalize-final-draft-obligation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize Final Draft obligation integration"
          git push origin HEAD:feature/final-draft-obligation-flow

      - name: Merge pull request into main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sleep 4
          gh pr merge 3 \
            --repo huojigaowan-sketch/draft \
            --squash \
            --delete-branch
